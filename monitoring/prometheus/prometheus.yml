global:
  scrape_interval: 15s

scrape_configs:
  - job_name: student-service
    static_configs: [{ targets: ["student-service:8000"] }]
  - job_name: room-service
    static_configs: [{ targets: ["room-service:8000"] }]
  - job_name: booking-service
    static_configs: [{ targets: ["booking-service:8000"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]
